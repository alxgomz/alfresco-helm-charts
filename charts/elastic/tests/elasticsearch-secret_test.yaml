---
suite: test elasticsearch secret
templates:
  - elasticsearch-secret.yaml
tests:
  - it: "[pattern-4] should not render secret by default"
    asserts:
      - hasDocuments:
          count: 0

  - it: should render secret when credentials.enabled=true and no existingSecret
    set:
      elasticsearch:
        credentials:
          enabled: true
          username: elastic
          password: s3cret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: type
          value: Opaque

  - it: should not render secret when existingSecret.name is provided
    set:
      elasticsearch:
        credentials:
          enabled: true
          existingSecret:
            name: my-existing-secret
    asserts:
      - hasDocuments:
          count: 0
