coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: auto
        informational: true

comment:
  layout: "header, diff, flags, components, tree"
  behavior: default
  require_changes: false
  show_carryforward_flags: true

github_checks:
  annotations: true

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: activemq
      paths: ["charts/activemq/**"]
    - component_id: alfresco-activiti
      paths: ["charts/alfresco-activiti/**"]
    - component_id: alfresco-activiti-admin
      paths: ["charts/alfresco-activiti-admin/**"]
    - component_id: alfresco-adf-app
      paths: ["charts/alfresco-adf-app/**"]
    - component_id: alfresco-ai-transformer
      paths: ["charts/alfresco-ai-transformer/**"]
    - component_id: alfresco-audit-storage
      paths: ["charts/alfresco-audit-storage/**"]
    - component_id: alfresco-common
      paths: ["charts/alfresco-common/**"]
    - component_id: alfresco-connector-cic
      paths: ["charts/alfresco-connector-cic/**"]
    - component_id: alfresco-connector-hxi
      paths: ["charts/alfresco-connector-hxi/**"]
    - component_id: alfresco-connector-ms365
      paths: ["charts/alfresco-connector-ms365/**"]
    - component_id: alfresco-connector-msteams
      paths: ["charts/alfresco-connector-msteams/**"]
    - component_id: alfresco-repository
      paths: ["charts/alfresco-repository/**"]
    - component_id: alfresco-search-community
      paths: ["charts/alfresco-search-community/**"]
    - component_id: alfresco-search-enterprise
      paths: ["charts/alfresco-search-enterprise/**"]
    - component_id: alfresco-search-service
      paths: ["charts/alfresco-search-service/**"]
    - component_id: alfresco-share
      paths: ["charts/alfresco-share/**"]
    - component_id: alfresco-sync-service
      paths: ["charts/alfresco-sync-service/**"]
    - component_id: alfresco-transform-service
      paths: ["charts/alfresco-transform-service/**"]
    - component_id: elastic
      paths: ["charts/elastic/**"]
    - component_id: postgres
      paths: ["charts/postgres/**"]
codecov:
  bot: alfresco-build
